name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [production, staging]
        default: production

# Never run two deploys of the same branch at once; a newer push cancels an older one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write # lets the action record deployments and preview links on GitHub

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    # If the Next.js project lives in a subfolder, uncomment and set it:
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json   # if in a subfolder

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build # writes the static site to ./out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/out # working-directory applies to run: steps only, not to this action
          retention-days: 7

  preview:
    name: Preview (pull request)
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: out
      - name: Upload preview
        id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.142.0"
          command: preview --name pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Preview link
        run: echo "Preview ready at ${{ steps.preview.outputs.preview-url }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    environment:
      # push events don't set inputs, so default to production or the job binds to an empty
      # environment and can't see production-scoped secrets like CLOUDFLARE_API_TOKEN
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ (github.event.inputs.environment || 'production') == 'production' && 'https://qorvynsystems.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci # installs the locked, consistent esbuild 0.28.1 that wrangler needs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site/out # download path ignores working-directory (it's an action, not a run step)
      - run: npx wrangler deploy # local pinned wrangler; avoids wrangler-action's flaky on-the-fly install
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}